name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Pin the toolchain so reproducible builds are verifiable.
  GO_VERSION: "1.26.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: |
          go vet ./...
          GOOS=linux go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
      - name: test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/wilihandarwo/shipmono-agent/internal/version.Version=${VERSION}" \
              -o shipmono-agent-linux-${{ matrix.goarch }} ./cmd/shipmono-agent
      - uses: actions/upload-artifact@v4
        with:
          name: shipmono-agent-linux-${{ matrix.goarch }}
          path: shipmono-agent-linux-${{ matrix.goarch }}

  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      # CI publishes the binaries + checksums + SBOM. It does NOT sign:
      # checksums.txt.minisig is produced locally with the offline minisign key
      # (the secret never touches CI) and attached via `gh release upload`
      # afterwards (see README → Build & release). install.sh fails closed if the
      # signature is missing.
      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shipmono-agent-linux-amd64
            dist/shipmono-agent-linux-arm64
            dist/checksums.txt
            sbom.spdx.json
